[project]
name = "nuisance-noise-recorder"
version = "1.0"
description = "Record nuisance-noise samples from an external mic, analyse them, ask an audio model about them, and seal each run with a hashed, timestamped manifest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "matplotlib>=3.8",
    "PySide6>=6.8",
    "pyqtgraph>=0.13.7",
    "requests>=2.31",
]

[project.scripts]
nnrec = "noise_recorder.cli:main"
nuisance-noise-recorder = "noise_recorder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noise_recorder"]
